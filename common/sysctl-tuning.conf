# /etc/sysctl.d/99-smartdns-tuning.conf
#
# Tuning for a relay whose upstream leg is a 90 ms Iran -> Frankfurt hop.
# The RTT itself cannot be reduced - a traceroute shows one clean hop from the
# Iranian edge to DE-CIX Frankfurt at 89 ms, with 0% loss and 0.4 ms jitter,
# and every other exit region measured from this box is the same or worse
# (UAE 110 ms, Mumbai 203 ms). What is left to win is throughput, which the
# stock settings throttle badly at this bandwidth-delay product.

# Congestion control is NOT set here. BBR helps this workload a great deal, but
# it changes how every connection on the machine behaves, including services
# that have nothing to do with this one - so it is asked for rather than
# assumed, and lives in its own file the installer writes only on request.

# At 90 ms RTT a socket needs ~11 MB in flight to fill a 1 Gbit/s path. The
# stock 4 MB write buffer caps a single stream well below that.
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# A relay's connections go idle between bursts. Restarting slow start each time
# costs several RTTs - at 90 ms that is very visible on page loads.
net.ipv4.tcp_slow_start_after_idle = 0

# Find the real path MTU instead of stalling on a black-holed ICMP.
net.ipv4.tcp_mtu_probing = 1

# Saves one full RTT on connection setup where both ends support it.
net.ipv4.tcp_fastopen = 3

# Accept queues sized for many short-lived proxied connections.
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# Latency. The send buffer above is large on purpose, and a large buffer is a
# queue: data a socket has not sent yet sits in it, and a game's login or a
# chat keystroke waits behind a download that shares the connection. This caps
# what may sit unsent per socket, so the queue stays short and the big buffer
# still does its work in flight.
net.ipv4.tcp_notsent_lowat = 131072

# Packet loss. Every proxied connection takes a conntrack entry, and so does
# every DNS and STUN exchange. When the table is full the kernel does not queue
# - it drops the packet ("nf_conntrack: table full, dropping packet"), which a
# game sees as lag spikes and a console as a download that stalls. The stock
# limit follows the machine's memory and is often 65536; this is roughly
# 40 MB at the top, and an established TCP entry now lives four hours, not the
# five days a forgotten one used to.
net.netfilter.nf_conntrack_max = 131072
net.netfilter.nf_conntrack_tcp_timeout_established = 14400
net.netfilter.nf_conntrack_udp_timeout_stream = 60

# 0.1.4, loss. Three things that make a lossy path hurt less.
#
# A game's or a chat's connection sends little, and when a packet of it is lost
# the stock timer doubles every try, so the second loss in a row costs seconds.
# Linear timeouts for such thin streams retry at an even pace.
net.ipv4.tcp_thin_linear_timeouts = 1
# Keepalives. A connection that goes quiet for a while is the one a mobile
# operator's NAT forgets, and the first thing the phone then knows of it is a
# reset. nginx asks for keepalives on both of its sides (see the nginx
# configs); the stock first probe comes after two hours, long after the NAT
# has gone, so the probes start after a minute and give up after four missed.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 20
net.ipv4.tcp_keepalive_probes = 4
# DNS and STUN arrive in bursts on a UDP socket whose queue is small by
# default; what does not fit is dropped and counted as RcvbufErrors.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
