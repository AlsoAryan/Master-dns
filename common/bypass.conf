# /etc/dnsmasq.d/bypass.conf
#
# Names that must NOT be hijacked, even though a parent domain is routed.
# dnsmasq resolves by longest match, so these win over address=/<parent>/...
#
# Two separate reasons a name lands here. Both were found in real packet
# captures, and each cost a broken game before it was understood.
#
# 1. The service is not on TCP 443. The relay listens only on 80 and 443, so
#    pointing such a name at it makes the client fire SYNs into a void and retry
#    forever. EA's game stack is full of these:
#
#      gosredirector.ea.com   TCP 42130 / 42230   game-server redirector (FC 25)
#      blazeredirector.ea.com the same, for FC 26 (spring25.client.blazeredirector...)
#                             - and if it is routed, the redirector sees the exit's
#                             address while the Blaze servers it hands out see
#                             Iran's, and EA refuses the sign-in (reported with a
#                             German exit: "you must be signed in to PSN and EA")
#      blaze.ea.com           TCP 15000-15100     the actual game servers
#      gameservices.ea.com    TCP 10010, 11000    QoS coordinator, match stats
#      tnt-ea.com             TCP 8095            realtime messaging
#
#    Call of Duty's network layer is the same kind of thing: Demonware, whose
#    lobby (lsg.*) and STUN (genesis.stun.*) are not on 443. Routed, MW III
#    and Warzone stop at "Networking failed to start" (HUENEME - NEGEV);
#    resolved directly they come up (reported from a PS5 in Tehran, 0.8.5).
#
#      demonware.net          lsg, genesis.stun, loginservice
#
#    Four names under it are the exception, and they go the other way: plain
#    HTTPS on 443 that answers an Iranian address with 403, so the game stops
#    at "Checking for update" (HILLCAT). They are routed - a longer match than
#    demonware.net, so they win over the line below - from the cod-https group:
#
#      user-consent.prod.demonware.net
#      objectstore-publishers-cod.prod.demonware.net
#      objectstore-cloud-prod-rex.egcp.demonware.net
#      rex-gvs.prod.demonware.net
#
# 2. The service is reachable from Iran anyway, and routing it costs something.
#    The console's STUN server is us.np.stun.playstation.net - not a name under
#    np.playstation.net, so that line alone never caught it, and it went to the
#    relay with the rest of playstation.net. A PS5's Binding request carries the
#    old XOR-ONLY attribute (0x0021, from an early draft of the STUN revision) as
#    well as USERNAME and MESSAGE-INTEGRITY; coturn answers every such request
#    with 420 Unknown Attribute, so the relay cannot answer in Sony's place, and
#    the connection test ended in "NAT type: Failed" while the games themselves
#    worked. Resolved directly, the same console got NAT Type 2 at once. (An
#    older note here took ps5.np.playstation.net for the STUN server; it is a PSN
#    API host, and is not the name that matters.) Only gst.prod.dl.playstation.net
#    actually needs the exit (it does not complete TLS from Iran at all); the
#    rest of prod.dl and the playstation.com API stay routed with it.
#
#      np.playstation.net      ps5.np - the PSN API
#      np.dl.playstation.net   envelope2, uef, gs-sec.ww
#      stun.playstation.net    us.np.stun - the console's NAT test
#
#    The same reasoning was tried for Epic's backend and reverted - see below -
#    so verify per-name rather than assuming the rule generalises.
#
#    Rockstar is the opposite case, and the same lesson as Epic and EA: the
#    sign-in has to come from the address the game is later played from. GTA
#    Online stopped right after auth-prod.ros.rockstargames.com with 0x50060190
#    ("cannot connect to Rockstar's game services") on a PS5 in Iran, because that
#    name went out through the exit - Rockstar saw the exit's address - while the
#    console played from an Iranian one, and the sign-in was refused. The relay's
#    own path is fine, and every Rockstar host answers an Iranian address as it
#    answers the exit. Three zones go direct; rockstargames.com itself (the site,
#    Social Club, updates) stays routed:
#
#      ros.rockstargames.com                  auth-prod and the rest of the sign-in
#      cloud.rockstargames.com                the cloud save and game-state services
#      prod-locator-cloud.rockstargames.com   where the game is told to go next
#
#    (reported from a PS5 on Irancell, 0.10.7, exit abroad)
#
#    Epic's game backend is the other case, and the important one. Fortnite gets
#    into a match when ol.epicgames.com and friends resolve directly, and does
#    not when they are routed - matchmaking has to come from the same address the
#    console later plays from, or the game server ignores the gameplay packets.
#
#    I reverted this once on the strength of a capture that seemed to disprove
#    it. The capture was confounded: the bypass had left the console on an Epic
#    address that is unreachable from Iran, so the test failed for an unrelated
#    reason. Epic round-robins each name across many addresses and a few are
#    dead from here - one in thirty-three when sampled - which is why Fortnite
#    worked on some attempts and not others. epic-pin handles that by probing
#    each address and pinning only the ones that answer.
#
#      ol.epicgames.com                   account, fortnite, datarouter, fngw
#      ogs.live.on.epicgames.com          habanero, discovery
#      edea.live.use1a.on.epicgames.com   prm-dialogue
#
#    Still routed on purpose: epicgames.com itself (www and store are 403 from
#    Iran), cdn2.unrealengine.com and cdn-0001.qstv.on.epicgames.com.
#
#    core.windows.net is a third kind again: routing it is *demonstrably* broken.
#    A ClientHello for any *.core.windows.net name arrives at the exit with the SNI
#    missing - nginx logged sni="-" and dropped it - while an equally long test
#    hostname and every other domain came through intact. Something on the
#    Iran->exit leg mangles those particular handshakes. The same host answers 400
#    when reached directly from the relay, so direct beats routed here.
#
# Add more with:  smartdns bypass <domain>

server=/gosredirector.ea.com/#
server=/blazeredirector.ea.com/#
server=/blaze.ea.com/#
server=/gameservices.ea.com/#
server=/tnt-ea.com/#
server=/demonware.net/#
server=/np.playstation.net/#
server=/np.dl.playstation.net/#
server=/stun.playstation.net/#
server=/ros.rockstargames.com/#
server=/cloud.rockstargames.com/#
server=/prod-locator-cloud.rockstargames.com/#
server=/ol.epicgames.com/#
server=/ogs.live.on.epicgames.com/#
server=/edea.live.use1a.on.epicgames.com/#
server=/core.windows.net/#

# Voice, and two control channels, none of which the relay can carry.
#
#   discord.media   Discord voice and video: WebRTC over UDP, and the name the
#                   client measures every voice region with - routed, every
#                   region measures as the distance to the exit and it picks
#                   the wrong continent.
#   vivox.com       voice for Valorant, League of Legends and Rainbow Six: RTP
#                   over UDP.
#   steamserver.net Steam's connection managers, which is where a client signs
#                   in. Asked for its own list, Steam answers with 83 bare
#                   addresses on 27017 - no name at all, so nothing DNS does
#                   reaches them - and 200 WebSocket managers under this zone,
#                   on 27018 to 27024 and, for 19 of the 200, on 443. Routed,
#                   the ones that are not on 443 resolve to the relay and find
#                   nothing listening: the client waits, falls back to the
#                   address list, and the operator hears "Steam Connection
#                   Error" for a sign-in that does eventually work. The store,
#                   the community and everything a person browses stay routed;
#                   only the sign-in channel goes direct.
server=/discord.media/#
server=/vivox.com/#
server=/steamserver.net/#
