# Smart DNS relay (inside Iran) -> exit node abroad
worker_processes  auto;

# Each proxied stream connection holds two descriptors, client side and
# upstream side, so the effective ceiling is half this number. The default soft
# limit is 1024, which caps the box at ~500 concurrent connections no matter
# what worker_connections says - a PS5 game download opens far more than that in
# parallel and the surplus gets reset mid-transfer.
worker_rlimit_nofile 65535;

# Where errors go. Ubuntu builds nginx with --error-log-path=stderr, so without
# this line every error is written to the journal and /var/log/nginx/error.log
# stays empty except for one startup notice - which is the file the admin
# panel's "nginx errors" card reads, and the first place to look when a
# customer says a site will not open.
error_log /var/log/nginx/error.log warn;
load_module MODULE_PATH;

events {
    worker_connections  15000;
    multi_accept off;
}

stream {
    # One line per connection, for the customer's "used by service" chart:
    # who, which port, which name they asked for, and how much went each way.
    # smartdns-sync reads it every half minute, adds it up by service and
    # deletes it - the raw lines never live longer than about a minute, and
    # the names never reach the database. In /run, which is memory: the
    # lines never touch the disk, and not under /var/log/nginx, where the
    # daily logrotate would have kept a copy for two weeks.
    # Last, where it went: which exit carried it, for the usage per server -
    # "a:443, b:443" when the first refused and nginx went on to the next.
    log_format usage '$remote_addr $server_port $ssl_preread_server_name $bytes_sent $bytes_received $upstream_addr';
    access_log /run/smartdns-usage usage buffer=32k flush=10s;

    # The way to the exit: the upstreams to_exit_https, _http, _spotify and
    # _blizzard. With a tunnel, its end on this machine comes first and the
    # exit's own address is only the fallback - nginx turns to a backup server
    # when the first refuses, which is what the tunnel's local port does while
    # the tunnel is down. Written by the installer, and by smartdns-sync when
    # the admin panel turns this relay's tunnel on or off.
    include /etc/nginx/smartdns-exit.conf;
    # Which exit each customer goes through: this relay's own - to_exit -
    # unless the admin panel sent them through another, whose upstreams put
    # it first. By their address; kept by smartdns-sync.
    map $remote_addr $to_exit {
        include /etc/nginx/smartdns-customer-exits.map;
        default to_exit;
    }

    # doh begin
    # Port 443 carries two things: everything a customer opens, which goes on
    # to the exit untouched, and DNS over HTTPS to this relay's own name, which
    # does not. nginx reads the name the client asked for - it decrypts nothing
    # to do it - and sends the relay's own name to the DoH server further down.
    # Every other name goes exactly where it always went, and a client that
    # sends no name at all goes to the exit, as before.
    map $ssl_preread_server_name $https_target {
        # The DoH names this machine answers - its own, and any the admin
        # panel set - kept by the installer and smartdns-sync.
        include /etc/nginx/smartdns-doh-names.map;
        default       ${to_exit}_https;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass $https_target;
    }

    # DNS over TLS, for Android's "Private DNS". nginx ends TLS here with the
    # same certificate as the customer panel and hands the plain stream to
    # smartdns-doh with a PROXY line in front - which is how it knows whose
    # resolver to ask, since the connection itself now comes from loopback.
    # 8853 is the same door for an address not let in: the gate sends its
    # 853 here, past the firewall that shuts 853 to it, and smartdns-doh
    # answers it from the gate's resolver - the customer panel's names, and
    # this relay for everything else - so a phone on Private DNS offers to
    # open the panel as one on plain DNS does.
    server {
        listen 853 ssl;
        listen 8853 ssl;
        include /etc/nginx/smartdns-doh-cert.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 2m;
        proxy_pass 127.0.0.1:8054;
    }

    # 443 for an address not let in, sent here by the gate. Only this relay's
    # own DoH names are let through, to a DoH server of their own that
    # answers from the gate's resolver; every other name is shut at once, so
    # this door carries nobody anywhere.
    map $ssl_preread_server_name $gate_doh_name {
        include /etc/nginx/smartdns-doh-names.map;
        default "";
    }
    map $gate_doh_name $gate_target {
        ""      127.0.0.1:9;
        default 127.0.0.1:8454;
    }
    server {
        listen 5297;
        ssl_preread on;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        proxy_timeout 1m;
        proxy_pass $gate_target;
    }
    # doh end
    # nodoh begin
    server {
        listen 443;
        # Only to read the name for the usage chart; nothing is decrypted.
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass ${to_exit}_https;
    }
    # nodoh end

    # Port 80 is forwarded rather than answered. It used to return a 301 to
    # https here, which broke PlayStation downloads: their CDN is HTTP-only and
    # serves a mismatched certificate on 443, so the console followed our
    # redirect straight into a TLS failure. The exit decides what to do with
    # each Host now - proxying playstation traffic, redirecting the rest.
    server {
        listen 80;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass ${to_exit}_http;
    }

    # Spotify on 4070 - see the exit's config for why this port exists at all.
    server {
        listen 4070;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass ${to_exit}_spotify;
    }

    # Battle.net on 1119 - see the exit's config for why.
    server {
        listen 1119;
        # Only to read the name for the usage chart; nothing is decrypted.
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass ${to_exit}_blizzard;
    }
}

# doh begin
http {
    access_log off;
    server_tokens off;

    map "$request_method:$arg_dns" $doh_browser {
        "GET:"  1;
        default 0;
    }

    # The DoH server, on loopback: the stream on 443 is the only way in, so
    # nothing reaches it that the gate has not already let through.
    server {
        listen 127.0.0.1:8453 ssl http2;
        server_name __DOH_HOST__;
        include /etc/nginx/smartdns-doh-cert.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 8k;

        location /dns-query {
            # A browser that opened the address - somebody clicking it, or
            # pasting it in the wrong box - wants the setup page, not an error about a
            # missing query. A DoH client always sends dns= or POSTs.
            if ($doh_browser) {
                return 302 https://__DOH_HOST__:8443/doh-setup$uri;
            }
            proxy_pass http://127.0.0.1:8055;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Always 127.0.0.1 - the stream. smartdns-doh refuses anything
            # else, as something that found its way round the gate.
            proxy_set_header X-Real-IP $remote_addr;
            # Only the gate's own server below may say this.
            proxy_set_header X-Gate "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # Somebody who types the relay's name into a browser wants the panel.
        location / {
            return 302 https://__DOH_HOST__:8443/;
        }
    }

    # The gate's DoH, for an address not let in (port 5297 above). The same
    # names and certificate; smartdns-doh answers anything marked X-Gate from
    # the gate's resolver, whatever address is in the path, and holds each
    # address - which only the PROXY line knows - to a rate of its own.
    server {
        listen 127.0.0.1:8454 ssl http2 proxy_protocol;
        server_name __DOH_HOST__;
        include /etc/nginx/smartdns-doh-cert.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 8k;

        location /dns-query {
            proxy_pass http://127.0.0.1:8055;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Gate 1;
            proxy_set_header X-Client-IP $proxy_protocol_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location / {
            return 302 https://__DOH_HOST__:8443/;
        }
    }
}
# doh end
