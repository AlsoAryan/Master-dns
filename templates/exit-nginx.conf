# Smart DNS exit node (abroad) - nginx.conf
# Based on https://github.com/rohammosalli/smart-dns/blob/master/nginx.conf
worker_processes  auto;

# Each proxied stream connection holds two descriptors, client side and
# upstream side, so the effective ceiling is half this number. The default soft
# limit is 1024, which caps the box at ~500 concurrent connections no matter
# what worker_connections says - a PS5 game download opens far more than that in
# parallel and the surplus gets reset mid-transfer.
worker_rlimit_nofile 65535;

# Where errors go. Ubuntu builds nginx with --error-log-path=stderr, so without
# this line every error is written to the journal and /var/log/nginx/error.log
# stays empty except for one startup notice - which is the file the admin
# panel's "nginx errors" card reads, and the first place to look when a
# customer says a site will not open.
error_log /var/log/nginx/error.log warn;
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

events {
    worker_connections  15000;
    multi_accept off;
}

http {
    access_log off;
    resolver __RESOLVERS__ ipv6=off;
    resolver_timeout 5s;

    # single begin
    # One machine doing both ends (ROLE=single): the relay's own parts, which
    # an exit behind a relay does not have. The installer cuts this block out
    # everywhere else, and on a single machine it also drops every "allow the
    # relay only" line below - there is no relay, and the customers reach this
    # machine themselves, past the same gate a relay has.
    # doh begin
    server_tokens off;
    map "$request_method:$arg_dns" $doh_browser {
        "GET:"  1;
        default 0;
    }
    # The DoH server, on loopback: the stream on 443 hands it this machine's
    # own name, and nothing reaches 443 that the gate has not let through.
    server {
        listen 127.0.0.1:8453 ssl http2;
        server_name __DOH_HOST__;
        include /etc/nginx/smartdns-doh-cert.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 8k;

        location /dns-query {
            if ($doh_browser) {
                return 302 https://__DOH_HOST__:8443/doh-setup$uri;
            }
            proxy_pass http://127.0.0.1:8055;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            # Only the gate's own server below may say this.
            proxy_set_header X-Gate "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        location / {
            return 302 https://__DOH_HOST__:8443/;
        }
    }
    # The gate's DoH, for an address not let in, as on a relay.
    server {
        listen 127.0.0.1:8454 ssl http2 proxy_protocol;
        server_name __DOH_HOST__;
        include /etc/nginx/smartdns-doh-cert.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 8k;

        location /dns-query {
            proxy_pass http://127.0.0.1:8055;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Gate 1;
            proxy_set_header X-Client-IP $proxy_protocol_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        location / {
            return 302 https://__DOH_HOST__:8443/;
        }
    }
    # doh end
    # single end

    # Console download CDNs are served over plain HTTP. Both Sony and Microsoft
    # put theirs on Akamai's HTTP-only network:
    #
    #   gst.prod.dl.playstation.net -> ... -> ...edgesuite.net
    #   assets1.xboxlive.com        -> ... -> ...edgesuite.net
    #
    # Those edges answer port 443 with a generic a248.e.akamai.net certificate
    # that names no console host at all. Redirecting port 80 to https, as this
    # file used to, therefore sent the console to a certificate it correctly
    # refused. On the PS5 that was eight TLS alerts and a dead download; on the
    # Xbox it was a download that never started at all, with the console
    # re-resolving assets1.xboxlive.com dozens of times a minute.
    #
    # Forward these over HTTP instead of redirecting. Scoped to the console
    # domains deliberately: the relay's port 80 is open to the internet, and a
    # forward proxy that accepted any Host would be an open proxy.
    server {
        listen 80;
        listen [::]:80;
        server_name ~^.*\.(playstation\.(net|com)|xboxlive\.com|gamepass\.com)$;
        # The relays this exit serves, one allow line each: written by the
        # installer and rewritten by the admin panel when a relay is added
        # or taken off - so a second relay no longer means re-running the
        # installer here, and adding it no longer cuts the first one off.
        include /etc/nginx/smartdns-relays.conf;
        # The tunnel, when there is one: its end on this machine hands each
        # connection to nginx from loopback. Nothing else can arrive from here.
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://$http_host$request_uri;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Game data is large and range-requested; buffering it here would
            # add latency for no gain.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10m;
            proxy_read_timeout 10m;

            # Not every host under these domains actually serves plain HTTP -
            # packages.xboxlive.com does not, and proxying it produced a 504
            # where it used to get a clean redirect. Fall back to the old
            # behaviour when the upstream cannot be reached over HTTP, so this
            # can only help and never takes something away.
            proxy_intercept_errors on;
            error_page 502 504 = @https_redirect;
        }

        location @https_redirect {
            return 301 https://$http_host$request_uri;
        }
    }

    # Battle.net's patch servers, which the launcher asks for its version on
    # 1119 in plain HTTP - see the 1119 block in the stream section. Loopback
    # only: nothing reaches this but that block. Blizzard's names only, so it
    # is no proxy to anywhere else.
    server {
        listen 127.0.0.1:18119;
        server_name ~^.*\.(battle\.net|blizzard\.com)$;
        location / {
            proxy_pass http://$host:1119$request_uri;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 10m;
        }
    }
    server {
        listen 127.0.0.1:18119 default_server;
        server_name _;
        return 403;
    }

    # Everything else keeps the old behaviour.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }
}

stream {
    # single begin
    # One line per connection, for the customer's usage by service - the same
    # as a relay keeps, and read and deleted the same way by smartdns-sync.
    log_format usage '$remote_addr $server_port $ssl_preread_server_name $bytes_sent $bytes_received';
    access_log /run/smartdns-usage usage buffer=32k flush=10s;
    # single end

    # A TLS client should never send a bare IP as SNI. When one does, blindly
    # forwarding to $ssl_preread_server_name:443 sends the session straight back
    # at the relay, which forwards it here again - an infinite loop that pins
    # both boxes. Blackhole those, and empty SNI, into an unresolvable upstream
    # so the session is dropped instead.
    map $ssl_preread_server_name $target {
        default                 $ssl_preread_server_name;
        ""                      "";
        ~^[0-9.]+$              "";
        ~^\[?[0-9a-fA-F:]+\]?$  "";
    }

    # Where each name is sent from here. Everything leaves over IPv4, as it
    # always has. A blackholed $target is still ":443", which nginx cannot
    # resolve, so those sessions are still dropped rather than looped.
    map $target $upstream {
        default  $target:443;
        # google-v6 begin
        # Google's own names go to the hop below, which reaches them over IPv6.
        # Google refuses Gemini, AI Studio, NotebookLM and Labs to some exits'
        # IPv4 addresses: 403 over IPv4 and the real page over IPv6, from the
        # same machine a second apart - most likely because it has come to
        # place that address in a sanctioned country. Only Google's names,
        # because most of the rest of the list has no IPv6 at all. The
        # installer leaves this out on an exit without working IPv6.
        ~(^|\.)(google\.com|googleapis\.com|gstatic\.com|googleusercontent\.com|google|withgoogle\.com|googlevideo\.com|ggpht\.com|gvt1\.com)$  127.0.0.1:8446;
        # google-v6 end
    }

    # single begin
    # doh begin
    # A single machine answers DNS over HTTPS on its own name, like a relay;
    # every other name goes on as below.
    map $ssl_preread_server_name $https_target {
        # The DoH names this machine answers - its own, and any the admin
        # panel set - kept by the installer and smartdns-sync.
        include /etc/nginx/smartdns-doh-names.map;
        default       $upstream;
    }
    # DNS over TLS, as on a relay: TLS ends here and the stream goes to
    # smartdns-doh with a PROXY line saying who connected. 8853 is the same
    # door for an address not let in, as on a relay.
    server {
        listen 853 ssl;
        listen 8853 ssl;
        include /etc/nginx/smartdns-doh-cert.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 2m;
        proxy_pass 127.0.0.1:8054;
    }
    # 443 for an address not let in, as on a relay: this machine's own DoH
    # names only, to the gate's DoH; everything else shut at once.
    map $ssl_preread_server_name $gate_doh_name {
        include /etc/nginx/smartdns-doh-names.map;
        default "";
    }
    map $gate_doh_name $gate_target {
        ""      127.0.0.1:9;
        default 127.0.0.1:8454;
    }
    server {
        listen 5297;
        ssl_preread on;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        proxy_timeout 1m;
        proxy_pass $gate_target;
    }
    # doh end
    # single end

    # Only the Iran relay may use this proxy. Prevents open-proxy abuse.
    server {
        resolver __RESOLVERS__ ipv6=off;
        listen 443;
        include /etc/nginx/smartdns-relays.conf;
        # The tunnel, when there is one: its end on this machine hands each
        # connection to nginx from loopback. Nothing else can arrive from here.
        allow 127.0.0.1;
        deny all;
        ssl_preread on;
        proxy_connect_timeout 10s;
        # $upstream, or on a single machine with DoH $https_target, which is
        # $upstream for every name but this machine's own.
        proxy_pass __HTTPS_TARGET__;
    }
    # Spotify's access point. The desktop and phone apps ask apresolve for one
    # and are handed the same host on 4070, 443 and 80; they try 4070 first and
    # fall back, which is why they work through a relay that carries only 80
    # and 443. The PlayStation app does not fall back - it waits on 4070 and
    # the app never opens, on a line where 4070 is filtered.
    #
    # Nothing on this port names its destination: Spotify's own framing has no
    # SNI and no Host header, so there is nothing to read a hostname out of.
    # The port itself is the answer instead - only Spotify's access points are
    # reached on it - and ap.spotify.com is the name Spotify's own GSLB hands
    # out, so this follows them rather than pinning one region.
    server {
        listen 4070;
        resolver __RESOLVERS__ ipv6=off;
        include /etc/nginx/smartdns-relays.conf;
        allow 127.0.0.1;
        deny all;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass ap.spotify.com:4070;
    }

    # Battle.net. The desktop launcher signs in to {region}.actual.battle.net
    # and asks {region}.patch.battle.net for versions, both on 1119 and on
    # nothing else, so with battle.net routed and 1119 not carried the
    # launcher never opened. The sign-in is TLS and names its host, and goes
    # on like 443; the version check is plain HTTP, named only in its Host
    # header, and goes to the loopback server in the http section that reads
    # it. Blizzard's names only: anything else on this port is dropped.
    map $ssl_preread_server_name $blizzard_upstream {
        ~^[a-z0-9.-]+\.(battle\.net|blizzard\.com)$  $ssl_preread_server_name:1119;
        ""       127.0.0.1:18119;
        default  "";
    }
    server {
        listen 1119;
        resolver __RESOLVERS__ ipv6=off;
        include /etc/nginx/smartdns-relays.conf;
        allow 127.0.0.1;
        deny all;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
        proxy_pass $blizzard_upstream;
    }

    # google-v6 begin

    # The IPv6 hop: the same pass-through, asking the resolver for AAAA
    # records only. On loopback, so nothing outside this machine reaches it;
    # 8446 is on the list of ports the admin panel may not take.
    server {
        listen 127.0.0.1:8446;
        resolver __RESOLVERS__ ipv4=off;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_pass $ssl_preread_server_name:443;
    }
    # google-v6 end
}
